# @format

# Sentinel-1 GRD -> terrain-corrected gamma0 in dB -> Canny edges.
#
#   radar-snap validate examples/s1_grd_canny.yaml
#   radar-snap run examples/s1_grd_canny.yaml
#
# SNAP writes the GeoTIFF, then Canny (scikit-image) writes ${output_dir}/Canny.tif:
# uint8, 1 = edge, 0 = no edge, 255 = nodata; bands e.g. Gamma0_VV_db_Canny.
#
# With an existing gamma0 GeoTIFF this runs without SNAP:
#
#   pipeline:
#     Read: {file: /data/s1/out/gamma0_tc.tif}
#     Canny: {sigma: 2.0, use_quantiles: true, low_threshold: 0.8, high_threshold: 0.95}

vars:
  scene: /data/s1/S1A_IW_GRDH_1SDV_20240101T054321_20240101T054346_051234_062ABC_1234.zip
  output: /data/s1/out/gamma0_tc.tif

output_dir: /data/s1/out/edges

pipeline:
  Read:
    file: ${vars.scene}

  Apply-Orbit-File:
    orbitType: Sentinel Precise (Auto Download)
    continueOnFail: true

  Remove-GRD-Border-Noise:
    borderLimit: 500
    trimThreshold: 0.5

  ThermalNoiseRemoval:
    removeThermalNoise: true

  Calibration:
    outputBetaBand: true
    outputSigmaBand: false

  Terrain-Flattening:
    demName: Copernicus 30m Global DEM

  Speckle-Filter:
    filter: Refined Lee

  Terrain-Correction:
    demName: Copernicus 30m Global DEM
    imgResamplingMethod: BILINEAR_INTERPOLATION
    pixelSpacingInMeter: 10.0
    mapProjection: WGS84(DD)
    saveSelectedSourceBand: true

  LinearToFromdB: {}

  Write:
    file: ${vars.output}
    formatName: GeoTIFF

  Canny:
    # Gaussian smoothing; higher = fewer, smoother edges (speckle needs it)
    sigma: 2.0
    # quantile thresholds don't depend on the dB range, so they transfer between scenes
    use_quantiles: true
    low_threshold: 0.8
    high_threshold: 0.95
    bands: [1]
