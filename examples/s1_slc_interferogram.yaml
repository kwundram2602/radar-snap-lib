# @format

# Sentinel-1 SLC interferogram from a reference/secondary pair, unwrapped
# via snaphu and terrain-corrected to a displacement product.
#
#   radar-snap run examples/s1_slc_interferogram.yaml
#
# Not a linear chain: two Read nodes feed Back-Geocoding, and TOPSAR-Split
# is used twice. Both need the reserved keys -- `op` to name the operator
# when the node id differs from it, and `sources` to wire inputs
# explicitly. The SnaphuExport -> SnaphuImport edge is also special: SNAP
# can't unwrap phase itself, so `run_graph` splits execution there and
# shells out to the `snaphu` binary in between (see
# docs/superpowers/specs/2026-08-05-snaphu-subprocess-design.md).

# Where the executed graph XML and any `save:` intermediates are written.
output_dir: /home/kjell/projects/py_projects/radar-snap-lib/results/s1/petacciato

vars:
  reference: /home/kjell/projects/py_projects/radar-snap-lib/results/s1/petacciato/S1A_IW_SLC__1SDV_20260402T050335_20260402T050402_063896_080959_D909.zip
  secondary: /home/kjell/projects/py_projects/radar-snap-lib/results/s1/petacciato/S1C_IW_SLC__1SDV_20260408T050246_20260408T050313_007120_00E6B1_F95B.zip
  output: /home/kjell/projects/py_projects/radar-snap-lib/results/s1/petacciato/interferogram.dim
  snaphu_folder: /home/kjell/projects/py_projects/radar-snap-lib/results/s1/petacciato/snaphu
  subswath: IW3
  polarisation: VV

pipeline:
  read_ref:
    op: Read
    file: ${vars.reference}

  orbit_ref:
    op: Apply-Orbit-File
    sources: read_ref

  split_ref:
    op: TOPSAR-Split
    sources: orbit_ref
    subswath: ${vars.subswath}
    selectedPolarisations: ${vars.polarisation}

  read_sec:
    op: Read
    sources: []
    file: ${vars.secondary}

  orbit_sec:
    op: Apply-Orbit-File
    sources: read_sec

  split_sec:
    op: TOPSAR-Split
    sources: orbit_sec
    subswath: ${vars.subswath}
    selectedPolarisations: ${vars.polarisation}

  coreg:
    op: Back-Geocoding
    sources: [split_ref, split_sec]
    demName: Copernicus 30m Global DEM
    resamplingType: BISINC_5_POINT_INTERPOLATION
    maskOutAreaWithoutElevation: true

  Enhanced-Spectral-Diversity:
    sources: coreg

  Interferogram:
    sources: Enhanced-Spectral-Diversity
    subtractFlatEarthPhase: true
    includeCoherence: true
    cohWinRg: 10
    cohWinAz: 2

  TOPSAR-Deburst: {}

  Multilook:
    nRgLooks: 4
    nAzLooks: 1

  GoldsteinPhaseFiltering:
    alpha: 1.0
    # Materialised as BEAM-DIMAP so it opens in SNAP Desktop; this is
    # the product to hand to SnaphuExport by hand.
    save: ifg_filtered

  SnaphuExport:
    targetFolder: ${vars.snaphu_folder}
    statCostMode: DEFO

  SnaphuImport:
    sources: SnaphuExport

  PhaseToDisplacement: {}

  Terrain-Correction:
    demName: Copernicus 30m Global DEM

  Write:
    file: ${vars.output}
    formatName: BEAM-DIMAP
