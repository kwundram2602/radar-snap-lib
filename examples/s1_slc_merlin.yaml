# Sentinel-1 SLC -> MERLIN-despeckled, calibrated, terrain-corrected sigma0.
#
#   radar-snap validate examples/s1_slc_merlin.yaml
#   radar-snap dump-xml examples/s1_slc_merlin.yaml -o /tmp/graph.xml
#   radar-snap run examples/s1_slc_merlin.yaml
#
# DeepDespeckle runs in Python (the 'despeckle' extra): graph a writes the deburst
# product as BEAM-DIMAP, MERLIN writes DeepDespeckle.dim, graph b reads it.
# MERLIN needs the complex i/q bands, so it precedes any detection (Multilook,
# Calibration to intensity); its output looks like a GRD.

vars:
  scene: /data/s1/S1A_IW_SLC__1SDV_20240627T171631_20240627T171658_054512_06A24B_4234.zip
  subswath: IW2
  polarisation: VV

output_dir: /data/s1/merlin

pipeline:
  Read:
    file: ${vars.scene}

  Apply-Orbit-File:
    orbitType: Sentinel Precise (Auto Download)
    continueOnFail: true

  TOPSAR-Split:
    subswath: ${vars.subswath}
    selectedPolarisations: ${vars.polarisation}
    firstBurstIndex: 3
    lastBurstIndex: 4

  TOPSAR-Deburst:
    selectedPolarisations: ${vars.polarisation}

  DeepDespeckle:
    method: merlin
    model: Sentinel-TOPS

  Calibration:
    outputSigmaBand: true

  Terrain-Correction:
    demName: Copernicus 30m Global DEM
    pixelSpacingInMeter: 10.0
    mapProjection: WGS84(DD)

  Write:
    file: ${output_dir}/sigma0_merlin_tc.tif
    formatName: GeoTIFF
