# @format

# Sentinel-1 SLC -> calibrated, terrain-corrected sigma0 backscatter.
#
#   radar-snap validate examples/s1_slc_standard.yaml
#   radar-snap run examples/s1_slc_standard.yaml --dump-xml /tmp/graph.xml
#
# TOPSAR chain: split, calibrate, deburst, multilook, geocode. Linear, no wiring.

vars:
  scene: results/s1/wue/S1A_IW_SLC__1SDV_20240627T171631_20240627T171658_054512_06A24B_4234.zip
  output: results/s1/out/sigma0_tc_IW3_sub.tif
  subswath: IW3
  polarisation: VV
  # AOI: vector file, [W, S, E, N] or WKT (as in the search config).
  aoi: /home/kjell/wue_aoi.gpkg

pipeline:
  Read:
    file: ${vars.scene}

  Apply-Orbit-File:
    orbitType: Sentinel Precise (Auto Download)
    continueOnFail: true

  TOPSAR-Split:
    subswath: ${vars.subswath}
    selectedPolarisations: ${vars.polarisation}
    # Keep bursts intersecting the AOI. Subset before deburst: a pixel/geo
    # subset on raw SLC can split a burst. ${aoi_wkt:...} turns vars.aoi into WKT.
    wktAoi: ${aoi_wkt:${vars.aoi}}

  Calibration:
    outputSigmaBand: true
    selectedPolarisations: ${vars.polarisation}

  TOPSAR-Deburst:
    selectedPolarisations: ${vars.polarisation}

  Multilook:
    nRgLooks: 4
    nAzLooks: 1
    outputIntensity: true

  Terrain-Correction:
    demName: Copernicus 30m Global DEM
    imgResamplingMethod: BILINEAR_INTERPOLATION
    pixelSpacingInMeter: 10.0
    mapProjection: WGS84(DD)
    saveSelectedSourceBand: true

  Write:
    file: ${vars.output}
    formatName: GeoTIFF
