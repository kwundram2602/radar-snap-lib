# Sentinel-1 SLC scenes over an area of interest, ascending passes only.
#
#   radar-snap validate examples/search_s1_peta.yaml
#   radar-snap search   examples/search_s1_peta.yaml
#   radar-snap download examples/search_s1_peta.yaml
#
# All settings live here; downloading needs Earthdata credentials (.env.example).

# AOI: vector file (features unioned, reprojected to WGS-84), [W, S, E, N] or
# WKT. Uncomment the one you need.
aoi: /home/kjell/projects/py_projects/eo_terrain/pettaciato.gpkg
# aoi: [10.0, 50.0, 11.0, 51.0]
# aoi: POLYGON((10 50, 11 50, 11 51, 10 51, 10 50))

start: 2026-04-01
end: 2026-04-13


platform: SENTINEL-1
flight_direction: ASCENDING,DESCENDING
processing_level: SLC # GUNW
beam_mode: IW
relative_orbit: 124
polarization: VV+VH
max_results: 20


# Any ASFSearchOptions key, camelCase or snake_case:
# relative_orbit: 44
# season: [90, 270]

dest: results/s1/petacciato
processes: 4
output: results/Petacciato.geojson
