# Sentinel-1 SLC scenes over an area of interest, ascending passes only.
#
#   radar-snap validate examples/search_s1_slc.yaml
#   radar-snap search   examples/search_s1_slc.yaml
#   radar-snap download examples/search_s1_slc.yaml
#
# All settings live here; downloading needs Earthdata credentials (.env.example).

# AOI: vector file (features unioned, reprojected to WGS-84), [W, S, E, N] or
# WKT. Uncomment the one you need.
aoi: aois/testgebiet.gpkg
# aoi: [10.0, 50.0, 11.0, 51.0]
# aoi: POLYGON((10 50, 11 50, 11 51, 10 51, 10 50))

start: 2024-01-01
end: 2024-06-30

platform: SENTINEL-1
flight_direction: ASCENDING
processing_level: SLC
beam_mode: IW
polarization: VV+VH
max_results: 100

# Any ASFSearchOptions key, camelCase or snake_case:
# relative_orbit: 44
# season: [90, 270]

dest: /data/s1
processes: 4
output: results/testgebiet.geojson
