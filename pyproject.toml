[project]
name = "radar-snap-lib"
version = "0.1.0"
description = "SAR/radar utilities: ASF search, SLC processing, and DEM creation from ALOS data"
readme = "README.md"
authors = [
    { name = "kwundram2602", email = "134778951+kwundram2602@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asf-search>=7.0",
    "numpy>=2.0",
    "omegaconf>=2.4",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "scipy>=1.13",
    "geopandas>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# DeepDespeckle pipeline node. Which torch build (CPU or CUDA) is the installing
# project's choice -- this extra deliberately pins no index, or it would clash
# with the torch index of a project that depends on radar-snap-lib.
despeckle = [
    "deepdespeckling @ git+https://github.com/kwundram2602/deepdespeckling.git@main",
    "torch>=2.6",
]

[project.scripts]
install-local = "scripts.install_local:main"
radar-snap = "radar_snap_lib.snap_ops.cli:main"

[project.urls]
Homepage = ""
Repository = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the despeckle extras pin deepdespeckling to the fork by git URL
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/radar_snap_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "snap: requires a working esa_snappy / SNAP install (boots the JVM)",
    "network: hits the live ASF API (deselected by default, see addopts)",
]
addopts = "-m 'not network'"

[tool.radar-snap-lib]
# Path to the virtual environment that contains `esa_snappy` (created by SNAP's
# `snappy-conf`). It is NOT installed as a dependency -- radar-snap-lib only puts
# its site-packages on sys.path at runtime.
#
# Override without touching this file (highest precedence first):
#   1. environment variable  ESA_SNAPPY_VENV=/path/to/esa_snappy_env/.venv
#   2. a `.env` file in the project root (see .env.example)
esa-snappy-venv = "/home/kjell/projects/py_projects/esa_snappy_env/.venv"

# torch for developing this repo: the `cpu` group by default (~200 MB), or for an
# NVIDIA GPU `uv sync --no-default-groups --group dev --group cu128 --extra despeckle`.
# Groups never reach projects that depend on radar-snap-lib, so neither do these
# index pins.
[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu128", group = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ty.environment]
# esa_snappy lives outside this project's venv (see [tool.radar-snap-lib]);
# point ty at it so `import esa_snappy` resolves. Adjust alongside esa-snappy-venv.
extra-paths = [
    "/home/kjell/projects/py_projects/esa_snappy_env/.venv/lib/python3.13/site-packages",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
cpu = ["torch>=2.6"]
cu128 = ["torch>=2.6"]
