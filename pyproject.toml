[project]
name = "radar-snap-lib"
version = "0.1.0"
description = "SAR/radar utilities: ASF search, SLC processing, and DEM creation from ALOS data"
readme = "README.md"
authors = [
    { name = "kwundram2602", email = "134778951+kwundram2602@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asf-search>=7.0",
    "numpy>=2.0",
    "omegaconf>=2.4",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "scipy>=1.13",
    "geopandas>=1.0",
    "scikit-image>=0.24",
    "tifffile>=2026.10.15",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# DeepDespeckle node. No torch index pinned: the depending project picks CPU/CUDA.
despeckle = [
    "deepdespeckling @ git+https://github.com/kwundram2602/deepdespeckling.git@main",
    "torch>=2.6",
]

[project.scripts]
install-local = "scripts.install_local:main"
radar-snap = "radar_snap_lib.snap_ops.cli:main"

[project.urls]
Homepage = ""
Repository = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the despeckle extras pin deepdespeckling to the fork by git URL
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/radar_snap_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "snap: requires a working esa_snappy / SNAP install (boots the JVM)",
    "network: hits the live ASF API (deselected by default, see addopts)",
]
addopts = "-m 'not network'"

[tool.radar-snap-lib]
# venv with `esa_snappy` (from SNAP's `snappy-conf`). Not a dependency: its
# site-packages are put on sys.path at runtime.
# Overrides (highest first): env var ESA_SNAPPY_VENV, then `.env` (.env.example).
esa-snappy-venv = "/home/kjell/projects/py_projects/esa_snappy_env/.venv"

# Dev torch: `cpu` group by default (~200 MB); for an NVIDIA GPU
# `uv sync --no-default-groups --group dev --group cu128 --extra despeckle`.
# Groups and these index pins don't reach dependent projects.
[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu128", group = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ty.environment]
# Lets ty resolve `import esa_snappy` (outside the venv); keep in sync with
# esa-snappy-venv.
extra-paths = [
    "/home/kjell/projects/py_projects/esa_snappy_env/.venv/lib/python3.13/site-packages",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
cpu = ["torch>=2.6"]
cu128 = ["torch>=2.6"]
