[project]
name = "radar-snap-lib"
version = "0.1.0"
description = "SAR/radar utilities: ASF search, SLC processing, and DEM creation from ALOS data"
readme = "README.md"
authors = [
    { name = "kwundram2602", email = "134778951+kwundram2602@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asf-search>=7.0",
    "numpy>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
install-local = "scripts.install_local:main"

[project.urls]
Homepage = ""
Repository = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_snap_lib"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
